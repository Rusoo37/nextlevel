<!DOCTYPE html>
<html lang="es">

    <title>Pago Pendiente</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container-exito">
        <div class="container-texto">
            <!-- Ícono sin la animación de latido para que quede prolijo -->
            <div class="icon" style="animation: none;">⏳</div>
            
            <h1 style="color: #f59e0b;">Pago en proceso</h1>
            
            <p style="color: #4b5563; margin-bottom: 5px;">Estamos esperando la confirmación de Mercado Pago.</p>
            <p style="color: #4b5563; font-weight: 600; margin-bottom: 25px;">Una vez que se acredite el pago, tu turno quedará automáticamente confirmado.</p>
            
            <a href="/" style="text-decoration: none; width: 100%;">
                <!-- Botón naranja haciendo juego con el título -->
                <button class="btn-submit" style="background-color: #f59e0b;">Volver al inicio</button>
            </a>
        </div>
    </div>
