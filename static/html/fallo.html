<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en el pago</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container-exito">
        <div class="container-texto">
            <!-- Le sacamos la animación del latido para que el error quede fijo -->
            <div class="icon" style="animation: none;">❌</div>
            
            <h1 style="color: #dc2626;">El pago fue rechazado</h1>
            
            <p style="color: #4b5563; margin-bottom: 5px;">Hubo un problema procesando tu tarjeta. Tu turno no pudo ser confirmado.</p>
            <p style="color: #4b5563; font-weight: 600; margin-bottom: 25px;">Por favor, intentá nuevamente con otro medio de pago.</p>
            
            <a href="/" style="text-decoration: none; width: 100%;">
                <!-- Le cambiamos el color al botón para que sea rojo (error) en vez de verde o azul -->
                <button class="btn-submit" style="background-color: #ef4444;">Volver a intentar</button>
            </a>
        </div>
    </div>
</body>
</html>
